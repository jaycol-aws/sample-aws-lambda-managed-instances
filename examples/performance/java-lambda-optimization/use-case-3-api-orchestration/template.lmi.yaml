AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LMI Blog — Use Case 3: API Orchestration (Lambda Managed Instances)
  Demonstrates connection pool reuse and multi-concurrency thread utilization.

Parameters:
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>

Globals:
  Function:
    Tracing: Active
    CodeUri: target/api-orchestration-1.0.0-SNAPSHOT.jar
    Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
    Runtime: java21
    Timeout: 30
    MemorySize: 2048
    Architectures: [x86_64]
    Environment:
      Variables:
        ORDER_TABLE_NAME: !Ref OrderTable
        PRODUCT_TABLE_NAME: !Ref ProductTable
        NOTIFICATION_QUEUE_URL: !Ref NotificationQueue
        ALERT_TOPIC_ARN: !Ref AlertTopic
        MAIN_CLASS: com.aws.lmi.api.ApiOrchestrationApplication
        JAVA_TOOL_OPTIONS: "-XX:+TieredCompilation -XX:+UseG1GC -Xms512m -Xmx1408m -Xlog:gc:stderr:time,tags"

Resources:
  ApiCapacityProvider:
    Type: AWS::Serverless::CapacityProvider
    Properties:
      CapacityProviderName: !Sub "${AWS::StackName}-api-cp"
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds
      InstanceRequirements:
        Architectures: [x86_64]
      ScalingConfig:
        MaxVCpuCount: 40
        AverageCPUUtilization: 60.0
      Tags:
        UseCase: api-orchestration

  OrderApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Name: lmi-blog-api-managed-instances
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${AWS::StackName}'
      RetentionInDays: 30
      KmsKeyId: !GetAtt LogGroupKmsKey.Arn

  ProcessOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      AutoPublishAlias: live
      CapacityProviderConfig:
        Arn: !GetAtt ApiCapacityProvider.Arn
        ExecutionEnvironmentMemoryGiBPerVCpu: 2
        PerExecutionEnvironmentMaxConcurrency: 10
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: orderProcessorFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrderTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt NotificationQueue.QueueName
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertTopic.TopicName
      Events:
        PostOrder:
          Type: Api
          Properties:
            RestApiId: !Ref OrderApi
            Path: /orders
            Method: post


  OrderTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-orders"
      AttributeDefinitions:
        - AttributeName: customerId
          AttributeType: S
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: customerId
          KeyType: HASH
        - AttributeName: orderId
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: alias/aws/dynamodb
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ProductTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-products"
      AttributeDefinitions:
        - AttributeName: productId
          AttributeType: S
      KeySchema:
        - AttributeName: productId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: alias/aws/dynamodb
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-notifications"
      KmsMasterKeyId: alias/aws/sqs

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alerts"
      KmsMasterKeyId: alias/aws/sns

  LogGroupKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for CloudWatch Log Group encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAccountAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowCloudWatchLogs
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - 'kms:Encrypt*'
              - 'kms:Decrypt*'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:Describe*'
            Resource: '*'
            Condition:
              ArnLike:
                'kms:EncryptionContext:aws:logs:arn': !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'

Outputs:
  ApiEndpoint:
    Value: !Sub "https://${OrderApi}.execute-api.${AWS::Region}.amazonaws.com/prod/orders"
  Arn:
    Value: !GetAtt ApiCapacityProvider.Arn
  OrderTableName:
    Value: !Ref OrderTable
  ProductTableName:
    Value: !Ref ProductTable
