AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LMI Blog — Use Case 2: Data Aggregation ETL (Lambda Managed Instances)
  Demonstrates GC tuning and heap management on long-lived instances.

Parameters:
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>

Globals:
  Function:
    Tracing: Active
    CodeUri: target/data-aggregation-1.0.0-SNAPSHOT.jar
    Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
    Runtime: java21
    Timeout: 120
    MemorySize: 2048
    Architectures: [x86_64]
    Environment:
      Variables:
        SENSOR_TABLE_NAME: !Ref SensorTable
        OUTPUT_BUCKET_NAME: !Ref OutputBucket
        MAIN_CLASS: com.aws.lmi.etl.DataAggregationApplication
        JAVA_TOOL_OPTIONS: "-XX:+TieredCompilation -XX:+UseG1GC -Xms512m -Xmx1408m -Xlog:gc:stderr:time,tags"

Resources:
  EtlCapacityProvider:
    Type: AWS::Serverless::CapacityProvider
    Properties:
      CapacityProviderName: !Sub "${AWS::StackName}-etl-cp"
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds
      InstanceRequirements:
        Architectures: [x86_64]
      ScalingConfig:
        MaxVCpuCount: 40
        AverageCPUUtilization: 70.0
      Tags:
        UseCase: data-aggregation

  AggregationApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Name: lmi-blog-etl-managed-instances
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${AWS::StackName}'
      RetentionInDays: 30
      KmsKeyId: !GetAtt LogGroupKmsKey.Arn

  AggregateDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      AutoPublishAlias: live
      CapacityProviderConfig:
        Arn: !GetAtt EtlCapacityProvider.Arn
        ExecutionEnvironmentMemoryGiBPerVCpu: 2
        PerExecutionEnvironmentMaxConcurrency: 5
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: dataAggregatorFunction
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SensorTable
        - S3CrudPolicy:
            BucketName: !Ref OutputBucket
      Events:
        PostAggregate:
          Type: Api
          Properties:
            RestApiId: !Ref AggregationApi
            Path: /aggregate
            Method: post


  SensorTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-sensors"
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: alias/aws/dynamodb
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-output-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          - Id: Cleanup
            Status: Enabled
            ExpirationInDays: 7
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionRule:
              ServerSideEncryptionByDefault:
                SSEAlgorithm: aws:kms
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        LogFilePrefix: access-logs/
      VersioningConfiguration:
        Status: Enabled
      ObjectLockEnabled: true
      AccessControl: Private

  LogGroupKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for CloudWatch Log Group encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAccountAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowCloudWatchLogs
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - 'kms:Encrypt*'
              - 'kms:Decrypt*'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:Describe*'
            Resource: '*'
            Condition:
              ArnLike:
                'kms:EncryptionContext:aws:logs:arn': !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'

Outputs:
  ApiEndpoint:
    Value: !Sub "https://${AggregationApi}.execute-api.${AWS::Region}.amazonaws.com/prod/aggregate"
  Arn:
    Value: !GetAtt EtlCapacityProvider.Arn
  SensorTableName:
    Value: !Ref SensorTable
